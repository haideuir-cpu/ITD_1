<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ITD SPORTS PRO</title>
  <style>
    :root {
      --bg: #0b1116;
      --card: #162029;
      --accent: #1e90ff;
      --gold: #f1c40f;
      --text: #ffffff;
      --muted: #8e99a2;
      --line: rgba(255,255,255,0.12);
      --shadow: rgba(0,0,0,0.35);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Tahoma, Arial, sans-serif;
      height: 100%;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .app-shell {
      width: min(100%, 480px);
      min-height: 100vh;
      background: linear-gradient(180deg, #0b1116 0%, #101b23 100%);
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
      padding: 18px 14px 90px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 16px;
    }

    .brand {
      font-weight: 900;
      letter-spacing: 0.5px;
      color: var(--accent);
      font-size: 1.1rem;
    }

    .search-box {
      position: relative;
      margin-bottom: 18px;
    }

    .search-box input {
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.04);
      border-radius: 18px;
      color: var(--text);
      padding: 12px 42px 12px 14px;
      font-size: 0.95rem;
      outline: none;
    }

    .search-box input::placeholder { color: var(--muted); }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      border: 2px solid var(--muted);
      border-radius: 50%;
      opacity: 0.9;
    }

    .search-icon::after {
      content: "";
      position: absolute;
      width: 8px;
      height: 2px;
      background: var(--muted);
      border-radius: 2px;
      transform: rotate(45deg);
      right: -5px;
      bottom: -2px;
    }

    .stories-wrap {
      margin-bottom: 18px;
    }

    .stories-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding: 0 2px;
    }

    .stories-label {
      font-weight: 700;
      color: var(--text);
      font-size: 0.95rem;
    }

    .stories-rail {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 4px;
    }

    .stories-rail::-webkit-scrollbar { display: none; }

    .story-item {
      min-width: 72px;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }

    .story-ring {
      width: 64px;
      height: 64px;
      margin: 0 auto 8px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, #f9d423 0%, #ff4e50 25%, #9b59b6 50%, #1e90ff 100%);
      box-shadow: 0 8px 18px rgba(30,144,255,0.2);
    }

    .story-ring.has-story {
      border: 2px solid #f1c40f;
    }

    .story-avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background-size: cover;
      background-position: center;
      border: 2px solid #0b1116;
    }

    .story-name {
      font-size: 0.72rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 72px;
      display: block;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 16px 0 12px;
      color: var(--text);
      font-weight: 800;
      font-size: 0.95rem;
      padding: 0 2px;
    }

    .section-title small {
      color: var(--muted);
      font-weight: 700;
      font-size: 0.72rem;
    }

    .suggestions-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .suggestion-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 12px 26px rgba(0,0,0,0.18);
    }

    .user-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }

    .user-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background-size: cover;
      background-position: center;
      border: 2px solid rgba(255,255,255,0.15);
      flex-shrink: 0;
    }

    .user-label {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .user-name {
      font-weight: 800;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-hint {
      color: var(--muted);
      font-size: 0.72rem;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .story-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f9d423, #ff4e50);
      display: inline-block;
      box-shadow: 0 0 10px rgba(249,212,35,0.8);
    }

    .follow-btn {
      border: none;
      background: var(--accent);
      color: white;
      font-weight: 800;
      padding: 10px 16px;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.15s ease;
      font-size: 0.82rem;
      min-width: 86px;
    }

    .follow-btn:active { transform: scale(0.96); }

    .follow-btn.following {
      background: rgba(255,255,255,0.06);
      color: var(--text);
      border: 1px solid var(--line);
    }

    .empty-state {
      display: none;
      padding: 28px 10px;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      border: 1px dashed var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,0.02);
    }

    .empty-state.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="topbar">
      <div class="brand">ITD SPORTS</div>
      <div style="color:var(--muted);font-size:0.8rem;font-weight:700;">اقتراحات</div>
    </div>

    <div class="search-box">
      <input id="searchInput" type="text" placeholder="بحث عن أشخاص أو قصص" aria-label="بحث" />
      <span class="search-icon" aria-hidden="true"></span>
    </div>

    <div class="stories-wrap">
      <div class="stories-header">
        <span class="stories-label">القصص</span>
        <small style="color: var(--muted);">محدثة</small>
      </div>
      <div id="storiesRail" class="stories-rail"></div>
    </div>

    <div class="section-title">
      <span>اقتراحات للمتابعة</span>
      <small id="resultsCount">0</small>
    </div>

    <div id="suggestionsList" class="suggestions-list"></div>
    <div id="emptyState" class="empty-state">لا توجد نتائج مطابقة لبحثك.</div>
  </div>

  <script>
    const suggestedUsers = [
      {
        id: 1,
        name: 'سارة الحربي',
        handle: '@sarah_01',
        avatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=300&q=80',
        mutual: 'متابعة متبادلة',
        hasStory: true,
        storyLabel: 'ملعب اليوم',
        followText: 'متابعة'
      },
      {
        id: 2,
        name: 'أحمد النعيمي',
        handle: '@ahmedn',
        avatar: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=300&q=80',
        mutual: 'أشخاص تعرفهم',
        hasStory: false,
        storyLabel: 'لا يوجد قصة',
        followText: 'متابعة'
      },
      {
        id: 3,
        name: 'ليلى المهند',
        handle: '@leila.m',
        avatar: 'https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?auto=format&fit=crop&w=300&q=80',
        mutual: 'متابعة متبادلة',
        hasStory: true,
        storyLabel: 'مباراة اليوم',
        followText: 'متابعة'
      },
      {
        id: 4,
        name: 'يوسف العبادي',
        handle: '@yousef',
        avatar: 'https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=300&q=80',
        mutual: 'اقتراح لك',
        hasStory: false,
        storyLabel: 'لا يوجد قصة',
        followText: 'متابعة'
      },
      {
        id: 5,
        name: 'رنا الخالد',
        handle: '@rana.k',
        avatar: 'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=300&q=80',
        mutual: 'متابعة متبادلة',
        hasStory: true,
        storyLabel: 'تجهيزات الفريق',
        followText: 'متابعة'
      },
      {
        id: 6,
        name: 'طارق السعد',
        handle: '@tarek.s',
        avatar: 'https://images.unsplash.com/photo-1504593811423-6dd665756598?auto=format&fit=crop&w=300&q=80',
        mutual: 'أشخاص تعرفهم',
        hasStory: true,
        storyLabel: 'استوديو التحليل',
        followText: 'متابعة'
      }
    ];

    const state = {
      filter: '',
      following: new Set()
    };

    const storiesRail = document.getElementById('storiesRail');
    const suggestionsList = document.getElementById('suggestionsList');
    const emptyState = document.getElementById('emptyState');
    const searchInput = document.getElementById('searchInput');
    const resultsCount = document.getElementById('resultsCount');

    function buildStories() {
      storiesRail.innerHTML = suggestedUsers
        .filter(user => user.hasStory)
        .map(user => `
          <div class="story-item" title="${user.name}">
            <div class="story-ring ${user.hasStory ? 'has-story' : ''}">
              <div class="story-avatar" style="background-image:url('${user.avatar}')"></div>
            </div>
            <span class="story-name">${user.name.split(' ')[0]}</span>
          </div>
        `)
        .join('');

      if (!storiesRail.innerHTML.trim()) {
        storiesRail.innerHTML = '<div style="padding:10px 4px;color:var(--muted);font-size:0.75rem;">لا توجد قصص حالياً.</div>';
      }
    }

    function renderSuggestions() {
      const query = state.filter.trim().toLowerCase();
      const filtered = suggestedUsers.filter(user => {
        const haystack = `${user.name} ${user.handle} ${user.mutual}`.toLowerCase();
        return haystack.includes(query);
      });

      suggestionsList.innerHTML = filtered.map(user => `
        <div class="suggestion-card">
          <div class="user-meta">
            <div class="user-avatar" style="background-image:url('${user.avatar}')"></div>
            <div class="user-label">
              <div class="user-name">${user.name}</div>
              <div class="user-hint">
                ${user.hasStory ? '<span class="story-dot"></span>' : ''}
                <span>${user.hasStory ? user.storyLabel : user.mutual}</span>
              </div>
            </div>
          </div>
          <button class="follow-btn ${state.following.has(user.id) ? 'following' : ''}" data-user-id="${user.id}">
            ${state.following.has(user.id) ? 'تمت المتابعة' : user.followText}
          </button>
        </div>
      `).join('');

      resultsCount.textContent = filtered.length;
      emptyState.classList.toggle('show', filtered.length === 0);

      document.querySelectorAll('.follow-btn').forEach(button => {
        button.addEventListener('click', () => {
          const userId = Number(button.dataset.userId);
          if (state.following.has(userId)) {
            state.following.delete(userId);
          } else {
            state.following.add(userId);
          }
          renderSuggestions();
        });
      });
    }

    searchInput.addEventListener('input', (event) => {
      state.filter = event.target.value;
      renderSuggestions();
    });

    buildStories();
    renderSuggestions();
  </script>
</body>
</html>
